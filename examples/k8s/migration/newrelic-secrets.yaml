# New Relic credentials.
#
# IMPORTANT: this file contains placeholders only. Do NOT commit real keys to
# the repo. Use external-secrets, sealed-secrets, or SOPS to manage the actual
# values. The shape here matches what the deployments expect to be mounted.
#
# Two distinct keys:
#
#   1. Ingest license key  — write-only, used by the otel-collector to push
#      OTLP signals. Created in New Relic UI:
#        Account Settings → API keys → Insert key (kind: "Ingest - License")
#
#   2. User API Key — read-only, used by the agentos-server (Control Plane)
#      to query NerdGraph for traces. Created in New Relic UI:
#        Account Settings → API keys → Create key (kind: "User",
#        role: "Read-only")
#
# Treat both as secrets. Rotate per your team's policy.
---
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-otlp
  namespace: computeragent
type: Opaque
stringData:
  # Used by otel-collector. Mounted as NEW_RELIC_LICENSE_KEY env var.
  license-key: REPLACE_WITH_INGEST_LICENSE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-api
  namespace: computeragent
type: Opaque
stringData:
  # Used by agentos-server (Control Plane). Mounted as NEW_RELIC_USER_API_KEY env var.
  user-api-key: REPLACE_WITH_READ_ONLY_USER_API_KEY
  # Numeric account ID (visible in New Relic URL, e.g. "one.newrelic.com/.../accounts/<ID>")
  account-id: "0000000"
  # "US" or "EU" — selects api.newrelic.com vs api.eu.newrelic.com for NerdGraph.
  region: "US"
