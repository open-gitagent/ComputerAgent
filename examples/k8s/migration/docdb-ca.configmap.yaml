# AWS RDS combined CA bundle for DocumentDB TLS verification.
#
# Source of truth (download once + commit, or fetch in CI):
#   curl -sSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
#
# Rotate this ConfigMap annually (AWS publishes new bundles when CAs are
# refreshed). Bundles are backward-compatible — old certs stay valid while
# new ones are added.
#
# Mount into any pod that talks to DocumentDB at /etc/ssl/docdb/global-bundle.pem
# (matches the `tlsCAFile=` value in the DocumentDB connection string template).
apiVersion: v1
kind: ConfigMap
metadata:
  name: docdb-ca
  namespace: computeragent           # adjust to your namespace
data:
  global-bundle.pem: |
    # ─────────────────────────────────────────────────────────────────────
    # Replace this comment block with the contents of:
    #   https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
    #
    # Example download command in a Makefile / CI step:
    #
    #   curl -sSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
    #     -o k8s/migration/global-bundle.pem
    #
    # Then this ConfigMap can be generated by Kustomize:
    #
    #   configMapGenerator:
    #     - name: docdb-ca
    #       files:
    #         - global-bundle.pem
    # ─────────────────────────────────────────────────────────────────────
    -----BEGIN CERTIFICATE-----
    <REPLACE WITH AWS RDS GLOBAL BUNDLE>
    -----END CERTIFICATE-----
