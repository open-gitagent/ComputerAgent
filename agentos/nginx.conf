# SPA + reverse proxy. Mirrors agentos/vite.config.ts for dev parity.
#
#   /api/*      → agentos-server:8788/agentos/api/*  (dashboard surface)
#   /obs-api/*  → agentos-server:8788/v1/*           (observability surface)
#   /*          → SPA's index.html (client-side router)
#
# `agentos` resolves via the compose-internal DNS to the agentos-server container.

server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # Static gzip — Vite already pre-compresses common asset types, but enable
  # on-the-fly gzip for anything else that's text-y.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # ── Dashboard API ──────────────────────────────────────────────────
  # Strip the /api prefix and prepend /agentos/api to match the server's
  # actual mount path.
  location /api/ {
    proxy_pass         http://agentos:8788/agentos/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE — the chat-sandbox proxy + /run + /sandboxes/:id/chat all stream.
    # Disable buffering and bump timeouts so long-running streams stay open.
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;
  }

  # ── Observability surface ──────────────────────────────────────────
  # Strip the /obs-api prefix; the server's obs routes are mounted at /v1/*.
  location /obs-api/ {
    proxy_pass         http://agentos:8788/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── SPA — every non-asset path falls through to index.html ────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed Vite assets aggressively; HTML stays uncached.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
